    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              sand: '#F4E7D3',
              turquoise: '#40E0D0',
              coral: '#FF7F50',
              deepSand: '#e0d3bf',
              brightSand: '#fffbf0',

            boxShadow: {
              'neu-flat': '9px 9px 16px #e0d3bf, -9px -9px 16px #fffbf0',
              'neu-pressed': 'inset 9px 9px 16px #e0d3bf, inset -9px -9px 16px #fffbf0',

    <style>
      body { background-color: #F4E7D3; color: #4a4a4a; }
      .neu-card { background: #F4E7D3; border-radius: 2rem; box-shadow: 9px 9px 16px #e0d3bf, -9px -9px 16px #fffbf0; }
      .neu-inset { background: #F4E7D3; border-radius: 1rem; box-shadow: inset 4px 4px 8px #e0d3bf, inset -4px -4px 8px #fffbf0; }
      .neu-button { 
        background: #F4E7D3; 
        box-shadow: 6px 6px 12px #e0d3bf, -6px -6px 12px #fffbf0;
        transition: all 0.2s ease;
      }
      .neu-button:active { 
        box-shadow: inset 4px 4px 8px #e0d3bf, inset -4px -4px 8px #fffbf0;
        transform: scale(0.98);
      }
